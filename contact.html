<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
        }

        #particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 80%;
            max-width: 800px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 16px;
            background: rgba(27, 27, 27, 0.04);
            backdrop-filter: blur(4px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        h1 { font-size: 2em; margin-bottom: 10px; }
        p  { font-size: 1.1em; line-height: 1.6; }
        a  { color: #00bcd4; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 5px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header nav ul { display: flex; }
        .header nav li { margin-left: 20px; }
        .header nav a { color: #fff; text-decoration: none; }
        .header nav a:hover { text-decoration: underline; }

        .footer { text-align: center; margin-top: 20px; color: #888; }
    </style>
    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js"}}
    </script>
</head>
<body>
<div id="particles-container"></div>

<div class="content">
    <div class="header">
        <h1>Contact</h1>
        <nav>
            <ul>
                <li><a href="index.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </div>

    <section>
        <h2>Contact Me</h2>
        <p>You can reach me via:</p>
        <ul>
            <li>Email: <a href="mailto:oedemcontact@gmail.com">oedemcontact@gmail.com</a></li>
        </ul>
    </section>

    <footer class="footer">&copy; 2025 Ömer Demir. All rights reserved.</footer>
</div>

<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=5;
const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
document.getElementById('particles-container').appendChild(renderer.domElement);
const v=[],c=[];
for(let i=0;i<1000;i++){
    v.push((Math.random()-.5)*10,(Math.random()-.5)*10,(Math.random()-.5)*10);
    const col=new THREE.Color(0.1+Math.random()*0.9,0.1+Math.random()*0.4,0.1+Math.random()*0.4);
    c.push(col.r,col.g,col.b);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
geo.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.025,vertexColors:true}));
scene.add(pts);
(function a(){requestAnimationFrame(a);pts.rotation.x+=0.0002;pts.rotation.y+=0.0004;renderer.render(scene,camera);})();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
