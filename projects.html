<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            font-family: sans-serif;
            color: #fff;
        }

        #particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 80%;
            max-width: 800px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 16px;
            background: rgba(27, 27, 27, 0.04);
            backdrop-filter: blur(4px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        h1, h2, p { text-align: center; }
        h2 { font-size: 1.8em; margin-bottom: 10px; }
        p  { font-size: 1.1em; line-height: 1.6; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .header h1 { margin: 0; font-size: 24px; text-align: left; }
        .header nav ul { list-style: none; padding: 0; margin: 0; display: flex; }
        .header nav li { margin-left: 20px; }
        .header nav a { color: #fff; text-decoration: none; font-size: 1.1em; }
        .header nav a:hover { text-decoration: underline; }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        /* Added video to the CSS selectors */
        .gallery-grid img, 
        .gallery-grid video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }
        .gallery-grid img:hover, 
        .gallery-grid video:hover { transform: scale(1.05); }

        .fullscreen-overlay {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .fullscreen-image { max-width:90%; max-height:90%; border-radius:10px; }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #888;
        }
    </style>
    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js"}}
    </script>
</head>
<body>
<div id="particles-container"></div>

<div class="content">
    <div class="header">
        <h1>Projects</h1>
        <nav>
            <ul>
                <li><a href="index.html">About</a></li>

    </div>

    <section>

    <section class="gallery-grid">
        <video src="3500a2p3video0001-0100.mkv"       autoplay loop muted playsinline onclick="openFullscreen(this)"></video>
        <video src="6300abek2er_1video0001-0110.mkv"     autoplay loop muted playsinline onclick="openFullscreen(this)"></video>
        <video src="6300abek2video0001-0110.mkv"       autoplay loop muted playsinline onclick="openFullscreen(this)"></video>
        
        <video src="X-plore_3300-3500-Alle_Filter.mp4" autoplay loop muted playsinline onclick="openFullscreen(this)"></video>

        <img src="untitled28.png"              alt="3D Scene"   onclick="openFullscreen(this)">

    <footer class="footer">&copy; 2025 Ömer Demir. All rights reserved.</footer>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay" onclick="closeFullscreen()">
    <img id="fullscreenImage" class="fullscreen-image" src="" alt="Fullscreen View" style="display: none;">
    <video id="fullscreenVideo" class="fullscreen-image" autoplay loop muted playsinline style="display: none;"></video>
</div>

<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;
const renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.getElementById('particles-container').appendChild(renderer.domElement);
const v=[], c=[];
for(let i=0;i<1000;i++){
    v.push((Math.random()-.5)*10,(Math.random()-.5)*10,(Math.random()-.5)*10);
    const col=new THREE.Color(0.1+Math.random()*0.9,0.1+Math.random()*0.4,0.1+Math.random()*0.4);
    c.push(col.r,col.g,col.b);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
geo.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:0.025,vertexColors:true}));
scene.add(pts);
(function a(){requestAnimationFrame(a);pts.rotation.x+=0.0002;pts.rotation.y+=0.0004;renderer.render(scene,camera);})();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
<script>
function openFullscreen(el) {
    const isVideo = el.tagName.toLowerCase() === 'video';
    const imgElement = document.getElementById('fullscreenImage');
    const videoElement = document.getElementById('fullscreenVideo');

    // Switch between img and video depending on what was clicked
    if (isVideo) {
        imgElement.style.display = 'none';
        videoElement.style.display = 'block';
        videoElement.src = el.currentSrc || el.src;
    } else {
        videoElement.style.display = 'none';
        videoElement.pause();
        imgElement.style.display = 'block';
        imgElement.src = el.src;
    }
    
    document.getElementById('fullscreenOverlay').style.display='flex';
}

function closeFullscreen() {
    document.getElementById('fullscreenOverlay').style.display='none';
    document.getElementById('fullscreenVideo').pause(); // Ensure audio/video stops
}
</script>
</body>
</html>
